# Stack de producción de la MAQUETA: un único servicio.
#
# `app` es el build de React servido por nginx. No hay `backend` ni Postgres: hoy
# todo el estado vive en el localStorage del navegador
# (frontend/src/api/store.js) y no existe una sola llamada de red a un servidor
# propio en frontend/src/. Es la primera app del ecosistema con un solo
# contenedor; el patrón de dos servicios de INSUMO/DOCKER.md se retoma
# tal cual en la fase 2, agregando `backend` y el depends_on con
# condition: service_healthy.
#
# Por lo mismo, /health lo responde el propio nginx (frontend/nginx.conf) y no un
# proxy hacia un backend que no existe.

services:
  app:
    build:
      # La RAÍZ del repo, no frontend/: es la convención del ecosistema, y deja
      # que el Dockerfile copie desde cualquier ruta relativa a la raíz cuando la
      # fase 2 traiga db/schema.sql.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # La app se sirve en la raíz del dominio
        # (https://reserva-bienestar.conaf.cl/catalogo).
        BASE_PATH: /
    ports:
      # APP_PORT sale del .env del servidor (ver .env.example): 8114, asignado en
      # el registro app_master.xlsx. El 8000 de la derecha es fijo — es el
      # `listen` de frontend/nginx.conf y no cambia por app.
      - "${APP_PORT:-8114}:8000"
    # Con un solo servicio no hay ningún depends_on que aproveche este estado,
    # pero es la única evidencia desde dentro del servidor: `docker compose ps`
    # dice healthy/unhealthy en vez de solo "Up". wget viene en BusyBox, en la
    # imagen alpine de nginx; curl no.
    healthcheck:
      # `127.0.0.1` y NO `localhost`. Dentro de este contenedor /etc/hosts pone
      # `::1 localhost` ANTES de la entrada IPv4, asi que `getent hosts localhost`
      # devuelve ::1; el nginx de la imagen declara `listen 8000;` a secas, o sea
      # solo IPv4; y el wget de BusyBox NO reintenta con IPv4 cuando el primero
      # falla. Resultado: el chequeo daba "Connection refused" contra ::1 mientras
      # la aplicacion respondia perfectamente. Medido dentro del contenedor en vm2
      # el 2026-09-27: con 127.0.0.1 devuelve "ok", con localhost y con [::1] falla.
      #
      # El defecto estaba en quien PREGUNTA, no en quien responde: la alternativa
      # era anadir `listen [::]:8000` al nginx de la imagen, y eso toca la
      # aplicacion para arreglar un chequeo.
      #
      # NO generalizar: en la flota hay 16 healthchecks con `localhost` y QUINCE
      # estan healthy. `localhost` no esta roto por si mismo; lo que rompe es la
      # combinacion de las tres cosas de arriba.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # R10: rotacion del log de Docker en todos los servicios (estandar de produccion, coipo_master_produccion, 2026-09-16)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
