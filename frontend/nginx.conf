# Nginx INTERNO del servicio `app` (dentro del contenedor). No confundir con el
# vhost del servidor, que vive en deploy/nginx-reserva-bienestar.conaf.cl.conf.
#
# Sirve un sitio 100% estático (el build de React). No hay un solo proxy_pass:
# esta es la primera app del ecosistema sin backend, y por eso /health lo responde
# este mismo nginx en vez de reenviarlo a http://backend:8000/health, como hacen
# las demás.

server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A stdout/stderr: dentro del contenedor nadie rota /var/log, y así los
    # registros salen por `docker compose logs app`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Lo consume el smoke test del pipeline de despliegue:
    #   curl -sf http://127.0.0.1:${APP_PORT}/health
    # Hace UN SOLO intento a los 5 segundos y sin reintentos: si no hay 200, el
    # deploy entero se marca rojo. Por eso la respuesta es una constante de nginx
    # y no depende de nada que tarde en arrancar.
    #
    # `default_type` y NO `add_header Content-Type`: un add_header dentro de un
    # location anula TODOS los heredados del server (se perderían las tres
    # cabeceras de seguridad del final) y además AÑADE una segunda cabecera en vez
    # de reemplazar la de default_type.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # SPA con BrowserRouter: /catalogo, /inmuebles/22 o /admin/auditoria no
        # existen como archivos en disco. Sin este try_files, recargar la página o
        # entrar por un enlace directo en cualquier ruta que no sea la raíz da
        # 404. Es exactamente lo que antes evitaba el HashRouter y lo que esta
        # línea reemplaza: si se toca, se rompe la navegación entera.
        try_files $uri $uri/ /index.html;
    }

    # Caché con `expires`, NO con add_header: en nginx un add_header dentro de un
    # location anula TODOS los heredados del server — el index se quedaría sin las
    # cabeceras de seguridad del final, que es justo donde importan.
    #
    # Este bloque también aplica al index que entrega el try_files de arriba: su
    # último parámetro provoca una redirección interna y nginx vuelve a elegir
    # location. Es lo que evita que alguien siga viendo la versión anterior de la
    # maqueta después de un despliegue.
    location = /index.html {
        expires -1;          # Cache-Control: no-cache — revalidar siempre
    }

    location /assets/ {
        expires 1y;          # los nombres llevan hash de Vite: son inmutables
    }

    # /assets/ a propósito SIN try_files: un asset que falta debe dar 404 y no
    # devolver el index.html con un 200, que es el error más difícil de
    # diagnosticar de todos (el navegador reporta un problema de MIME, no un
    # archivo faltante).

    # Nada de archivos ocultos (.env, .git) aunque alguien los copie por error.
    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
