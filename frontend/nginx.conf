# nginx del contenedor `app` — CONGELADO
# ======================================
# Sirve la SPA compilada y proxea al backend por la red interna de Docker. Es el UNICO
# servicio que publica puerto (APP_PORT -> 8000). Su sha256 esta en semilla.lock.
#
# Este archivo NO es el vhost del servidor. El vhost de vm2/vm3 escucha en 80, no
# termina TLS (lo corta el Alteon en 172.31.2.100) y proxea a 127.0.0.1:APP_PORT. Ese
# otro archivo vive en ops/nginx-host/ y no esta congelado: cambia con el dominio.
#
# Verifican este archivo: j01 (D-27) y el test de contrato test_nginx.py.

server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # POR QUE EL UPSTREAM VA EN UNA VARIABLE Y NO ESCRITO A PELO  (D-27)
    # ------------------------------------------------------------------------
    # Con un nombre literal -- proxy_pass http://backend:8000/api/; -- nginx resuelve
    # "backend" UNA SOLA VEZ, al cargar la configuracion, y se queda con esa IP
    # mientras viva el proceso.
    #
    # Eso rompe en cada despliegue que toca SOLO el backend: compose recrea el
    # contenedor del backend (IP nueva), la imagen de ESTE contenedor no cambio asi
    # que NO lo recrea, y nginx sigue hablandole a la direccion anterior. Resultado:
    # 502 con el backend perfectamente sano al lado y "docker compose ps" en verde
    # para todo. Y el smoke test del reusable es "curl -sf", que falla con cualquier
    # codigo >= 400 sin leer el cuerpo: el despliegue sale rojo sin ninguna pista de
    # por que.
    #
    # Con una variable, nginx resuelve en CADA peticion contra el DNS interno de
    # Docker, respetando el valid= de abajo.
    # ipv6=off porque ese resolver puede devolver AAAA y nginx intentaria conectar
    # por IPv6, donde no hay nadie escuchando.
    #
    # La correccion existe hoy solo en COIPO_USUARIOS, coipo_n8n y
    # coipo_seguimiento_madera. NO llego a los repositorios que la necesitan igual.
    # Ese es el argumento del vehiculo: lo que se copia, no se propaga.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $destino_backend backend;

    # OJO CON $request_uri: al usar variables en proxy_pass, nginx deja de sustituir
    # el prefijo del location y hay que pasar la URI explicitamente. Todos los
    # proxies de abajo son mapeos IDENTIDAD (/api/v1/x -> /api/v1/x), asi que pasar la
    # URI tal cual da exactamente las mismas rutas.
    #
    # Las cuatro cabeceras de proxy se repiten en cada bloque en vez de ir en un
    # include: el archivo esta sellado por sha256 y un include suelto en el arbol de
    # la aplicacion quedaria fuera del sello.

    # --- La API. Prefijo /api/v1 por decreto (D-03). -------------------------
    location /api/ {
        proxy_pass http://$destino_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend corre uvicorn con --no-proxy-headers y cuenta la IP desde la
        # DERECHA de X-Forwarded-For con TRUSTED_PROXY_HOPS (D-26). Este proxy es UNO
        # de esos saltos: si se anade o se quita un proxy delante, se corrige el
        # numero en la ficha del proyecto, no aqui.
    }

    # --- /health: primera de las DOS excepciones al prefijo /api/v1 (D-03) ---
    # Prefijo y no "location =": /health/detalle cuelga de aqui, y es la ruta que lee
    # el smoke test del despliegue despues del despliegue. /health nunca devuelve 3xx y nunca pide
    # sesion; el 503 solo aparece si el esquema de base de datos no se aplico. Un fallo
    # de DATOS no cambia el codigo de estado: vive en /health/detalle.
    location /health {
        proxy_pass http://$destino_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- /auth/callback: segunda excepcion al prefijo (D-03) -----------------
    # Va al BACKEND, no a la SPA. Aqui se canjea el code por el token del IAM
    # (servidor a servidor, con el client_secret), se llama UNA vez a /oauth/userinfo,
    # se DESCARTA el token y se emite la cookie httpOnly propia: es el patron BFF.
    # Sin este bloque caeria en el try_files de abajo, el navegador recibiria el
    # index.html con un 200, el codigo nunca se canjearia, y la SPA quedaria pidiendo
    # /me -> 401 -> IAM -> callback -> 200 con index.html, en bucle.
    #
    # Se usa la ruta SIN el prefijo /api/v1 porque es con la que estan registradas las
    # aplicaciones en el panel del COIPO IAM, que compara la redirect_uri por igualdad
    # EXACTA de string.
    #
    # "location =" (coincidencia exacta) y no "location /auth/": no se captura ninguna
    # otra ruta que la SPA pudiera querer usar. nginx conserva la query string
    # (?code=...&state=...) automaticamente.
    location = /auth/callback {
        proxy_pass http://$destino_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Datos en disco: NUNCA servirlos como estaticos ----------------------
    # Defensa en profundidad. El .dockerignore ya excluye data/ del contexto de build,
    # pero un archivo que se cuele en el directorio publico del bundler queda accesible
    # SIN sesion por el try_files de abajo. Ya paso en coipo_prensa2 con historico.json:
    # noticias completas servidas sin login.
    location /data/ {
        return 404;
    }

    # --- Estaticos con hash de contenido -------------------------------------
    # Vite emite /assets/<nombre>-<hash>.js. El hash cambia con el contenido, asi que
    # immutable es seguro: un archivo con ese nombre nunca cambia.
    #
    # TRAMPA DE NGINX, escrita porque se paga siempre: un add_header dentro de un
    # location CANCELA todos los add_header heredados del server. Por eso las
    # cabeceras de seguridad se repiten en cada bloque en vez de declararse una sola
    # vez arriba. Si se anade una cabecera, hay que anadirla en TODOS los bloques.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # --- El index NO se cachea -----------------------------------------------
    # Es el unico archivo cuyo nombre no lleva hash. Si el navegador lo cachea, un
    # despliegue nuevo sigue sirviendo el index viejo, que referencia bundles de
    # /assets/ que ya no existen: pantalla en blanco sin un solo error en el servidor.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- Fallback de SPA ------------------------------------------------------
    # AVISO que cuesta caro descubrir: con esta linea una ruta INEXISTENTE no devuelve
    # 404, devuelve 200 con el index.html dentro. Un asset que falta (porque el
    # .dockerignore lo excluyo, o porque el bundler no lo emitio) se ve en DevTools
    # como un icono que no aparece, sin una sola linea roja. Para comprobar que un
    # asset llego de verdad al artefacto desplegado hay que mirar el Content-Type y
    # los bytes magicos, no el codigo de estado:
    #     curl -sI  https://<dominio>/favicon-32.png                    -> image/png
    #     curl -s   https://<dominio>/favicon-32.png | head -c 4 | xxd  -> 89 50 4e 47
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        # DENY y no SAMEORIGIN: ninguna vista de estas aplicaciones se embebe en un
        # iframe, y la sesion es una cookie SameSite=Lax que un marco de terceros no
        # deberia poder pasear.
        add_header X-Frame-Options "DENY" always;
    }
}
