# Vhost de Nginx para reserva-bienestar.conaf.cl — Sistema de Reservas de la Red de
# Casas de Huéspedes y Veraneo, Servicio de Bienestar CONAF (maqueta).
#
# Vive en el SERVIDOR (/etc/nginx/sites-available/reserva-bienestar.conaf.cl.conf),
# NO lo despliega este repositorio. Se versiona acá para que no se pierda: la
# carpeta app_base/ de COIPO_DOCUMENTO, donde deberían estar los vhost reales,
# está en .gitignore por contener los .env.
#
# APP_PORT=8114 (registro app_master.xlsx, fila reserva_huesped).
#
# OJO con el registro: en app_master.xlsx la fila del 8114 todavía tiene el
# dominio reserva-huesped.conaf.cl, y reserva-bienestar.conaf.cl figura en la fila
# del 8110, sin repositorio. El dominio definitivo de esta app es
# reserva-bienestar.conaf.cl (decisión de 2026-08-12): hay que corregir la
# planilla, o el registro seguirá contradiciendo al servidor.
#
# ─────────────────────────────────────────────────────────────────────────────
# ESTE ARCHIVO SE ESCRIBIÓ DE CERO, NO SE COPIÓ DE OTRA APP. No es una
# advertencia teórica: ya pasó dos veces con esta misma aplicación.
#
#   · COIPO_DOCUMENTO/app_base/cabania/nginx.conf es una copia literal del vhost
#     de Moodle (academia.conaf.cl, puerto 8115).
#   · COIPO_DOCUMENTO/app_base/reserva-bienestar/nginx.conf es una copia literal
#     del de entrega_planta (nexe.conaf.cl, puerto 8113) — y esa fue la que se
#     instaló primero en el servidor: con el server_name cambiado pero el
#     proxy_pass todavía en 8113 y los logs en entrega_planta.*.log. El dominio
#     respondía 200 sirviendo nexe, y el 8114 quedaba sin vhost que lo alcanzara.
#
# Es el mismo incidente de usuario.conaf.cl, que devolvía 200 sirviendo el IAM.
# Un smoke test tiene que verificar QUÉ se sirve, no solo que responda 200:
#
#     curl -s -H "Host: reserva-bienestar.conaf.cl" http://127.0.0.1/ \
#       | grep -o '<title>[^<]*</title>'      # -> Red de Casas Bienestar CONAF
#
# Al instalar este archivo, reemplazar también las dos copias de app_base/.
# ─────────────────────────────────────────────────────────────────────────────
#
# ANTES DE INSTALARLO: confirmar que el 8114 está libre.
#     ss -tlnp | grep -w 8114 || echo "libre"
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESCUCHA EN EL 80 Y NO EN EL 443
#
#   navegador --https--> 172.31.2.100  (termina TLS, cert comodín *.conaf.cl)
#                             |
#                             +--http--> 172.31.2.41:80  (este vhost)
#                                             |
#                                             +--> 127.0.0.1:8114
#
# El 443 de .41 no escucha. El certificado *.conaf.cl cubre
# reserva-bienestar.conaf.cl porque es un dominio de un solo nivel. La plantilla
# _plantilla-app.conf de COIPO_DOCUMENTO, que trae un bloque 443, describe un plan
# que no es el estado real del servidor: no seguirla.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    # Solo el dominio. NO se agrega 172.31.2.41: esa IP ya la reclama otro vhost,
    # y un segundo server_name con la misma IP hace que nginx avise
    # "conflicting server name ... ignored" y se quede con el primero. Para probar
    # antes de que exista el DNS se usa el Host de la nota final.
    server_name reserva-bienestar.conaf.cl;

    # Logs propios: mezclarlos con los de otra app vuelve imposible depurar.
    access_log /var/log/nginx/reserva-bienestar.access.log;
    error_log  /var/log/nginx/reserva-bienestar.error.log;

    # Sin client_max_body_size: la maqueta no sube nada al servidor. La carga de
    # nómina del perfil administrador lee el archivo en el navegador y nunca hace
    # POST. Cuando llegue el backend (fase 2) habrá que fijarlo: con el default de
    # 1m las subidas fallan con un 413 que no deja rastro en la aplicación.

    location / {
        proxy_pass http://127.0.0.1:8114;
        proxy_http_version 1.1;

        # Imprescindible: tanto este nginx como el del contenedor enrutan por Host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts por defecto a propósito. Las otras apps suben a 300 s por sus
        # informes y exportaciones; acá el contenedor solo devuelve archivos
        # estáticos, y una respuesta que tarde más de un segundo ya es una falla,
        # no una consulta lenta. Copiar los 300 s solo escondería el problema.
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Mientras el DNS interno no exista, se prueba sin esperar a Informática:
#
#   curl -sI -H "Host: reserva-bienestar.conaf.cl" http://172.31.2.41/health
#
# o lanzando el navegador con la resolución forzada, sin tocar el archivo hosts:
#
#   chrome.exe --user-data-dir="%TEMP%\chrome-prueba-cabania" ^
#              --host-resolver-rules="MAP reserva-bienestar.conaf.cl 172.31.2.41" ^
#              http://reserva-bienestar.conaf.cl/catalogo
#
# Ojo: http, no https. El 443 de .41 está cerrado; el https solo funcionará
# cuando Informática cree el vhost en 172.31.2.100.
#
# Entrar por IP pelada da ERR_EMPTY_RESPONSE: el catch-all 00-default.conf
# (return 444) cierra la conexión cuando el Host no coincide con ningún vhost. No
# es un bug — y es también el síntoma de que el terminador TLS no está
# preservando el header Host.
# ─────────────────────────────────────────────────────────────────────────────
