; CONFIGURACION DE PYTEST — ARCHIVO CONGELADO DE LA SEMILLA
; ==========================================================
; Su sha256 esta en semilla.lock. La aplicacion generada NO lo edita: si una app
; necesita una marca nueva, es un cambio de la flota entera, no de un repo.
;
; POR QUE --strict-markers
; ------------------------
; Sin el, `@pytest.mark.requiere_bd` (una letra de diferencia con `requiere_db`) es
; una marca inventada que pytest acepta en silencio. El test queda fuera de
; `-m "t0 and requiere_db"` para siempre y su color es verde por ausencia. Es el
; mismo modo de fallo que D-08 documenta para `SESION_` con una sola S: la cosa
; arranca igual y la proteccion no existe.
;
; POR QUE --strict-config
; -----------------------
; Una clave mal escrita en este archivo se ignora en silencio. Con --strict-config
; revienta. Es la misma regla que `additionalProperties: false` en la ficha.
;
; POR QUE xfail_strict
; --------------------
; Un xfail que empieza a pasar deja de avisar de nada y se convierte en la via
; comoda para "arreglar" un test de contrato sin borrarlo. Con xfail_strict, un
; xfail que pasa es un fallo. Ademas conftest.py cuenta los xfail como saltos:
; ver la seccion "un skip es un fallo".
;
; LA TAXONOMIA ES OBLIGATORIA Y LA HACE CUMPLIR conftest.py
; ---------------------------------------------------------
; Tres ejes obligatorios en TODO test: capa + tipo + tier. La razon de que el tier
; tambien sea obligatorio: la compuerta corre `pytest -m t0`. Un test sin tier no
; corre nunca en la compuerta, nadie lo nota, y su estado permanente es "no
; ejecutado, verde" — exactamente la enfermedad de los tests de inmutabilidad y
; concurrencia de COIPO_ENTREGA_PLANTA, que llevan un `skipif` sobre una variable
; que ningun CI define.

[pytest]
minversion = 8.0
testpaths = tests
norecursedirs = .git .venv venv node_modules __pycache__ .pytest_cache htmlcov

addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --import-mode=importlib

xfail_strict = true

; Se convierten en error solo las advertencias que significan "este test no probo
; lo que crees". No se ponen TODAS en error: una deprecacion de una libreria de
; terceros pondria roja la suite entera por algo que no es de esta app, y una
; suite roja por ruido se termina apagando.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestCollectionWarning
    error::pytest.PytestReturnNotNoneWarning

markers =
    ; ── EJE 1: CAPA (exactamente una por test, obligatoria) ───────────────────
    ; Las cuatro primeras son la piramide y sus porcentajes se miden en
    ; tests/arquitectura/test_forma_de_la_piramide.py.
    dominio: L1 — reglas puras. Sin base de datos, sin red, sin reloj del sistema. Presupuesto < 5 s toda la capa.
    aplicacion: L2 — casos de uso contra dobles en memoria. Presupuesto < 30 s. MagicMock PROHIBIDO.
    adaptador: L3 — adaptadores contra Postgres 17 real, o contra un doble del borde. Presupuesto < 5 min.
    e2e: L4 — sobre la IMAGEN construida, no sobre uvicorn a mano. Presupuesto < 5 min. Maximo 10 por ciento de la suite.
    contrato: fuera de la piramide — tests congelados de la semilla (tests/contrato y tests/arquitectura). No cuentan en los porcentajes.

    ; ── EJE 2: TIPO (exactamente uno por test, obligatorio) ───────────────────
    invariante: afirma una regla que NO puede dejar de cumplirse. Si falla, se arregla el codigo.
    caracterizacion: describe lo que el sistema hace HOY. Si falla, puede que lo correcto sea actualizar el test.
    guardia: protege un limite operativo o de seguridad (permisos, cuotas, tiempos, secretos).

    ; ── EJE 3: TIER (exactamente uno por test, obligatorio) ───────────────────
    t0: entra en la compuerta de despliegue. Presupuesto total 600 s, verificado por el propio gate.
    t1: no bloquea el despliegue. Corre en la suite completa.

    ; ── BANDERAS (opcionales, cuantas haga falta) ─────────────────────────────
    nucleo: el nucleo irreducible. El CI lo corre PRIMERO y solo. Si esto falla, lo demas da igual.
    requiere_db: necesita el Postgres 17 efimero. SQLite y base falsa PROHIBIDOS (D-24).
    requiere_docker: necesita construir o levantar imagenes.
    requiere_red: necesita salir a la red. Debe ser rarisimo y estar justificado en el docstring.
    lento: tarda mas de 5 s por si solo.

    ; ── CUARENTENA (excepcional, con fecha) ───────────────────────────────────
    ; Uso: @pytest.mark.cuarentena(motivo="...", vence="AAAA-MM-DD")
    ; conftest.py exige motivo de 20 caracteres o mas, fecha futura, maximo 14
    ; dias de vida y maximo 3 tests en cuarentena a la vez. Es la UNICA forma de
    ; que un test salte sin poner la suite en rojo.
    cuarentena: fuera de la compuerta temporalmente. Exige motivo y vence. Maximo 3 simultaneas.
