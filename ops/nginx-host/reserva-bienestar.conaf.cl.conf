# Vhost del nginx DEL HOST en vm2 (172.31.2.41), puerto 80.
#
# Lo escribió `semilla/sembrar.py` al sembrar coipo_cabania. Este archivo es una
# REFERENCIA VERSIONADA: el despliegue NO lo instala. Lo copia a mano quien tenga
# sudo en la VM, y hasta que eso ocurra el dominio no existe para nadie.
#
#   sudo cp ops/nginx-host/reserva-bienestar.conaf.cl.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/reserva-bienestar.conaf.cl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   curl -H "Host: reserva-bienestar.conaf.cl" http://127.0.0.1/health
#
# «nginx -t» y se LEEN los avisos, no sólo el «syntax is ok»: un error aquí tumba
# TODOS los vhosts del host, no sólo éste.
#
# Convenciones de la flota: un dominio por archivo, el archivo se llama igual que
# el `server_name`, sin guiones bajos —no son válidos en un hostname— y sin IP en
# `server_name`. Un Host desconocido lo recoge el catch-all del host y responde
# 444: si un dominio nuevo devuelve 000 en curl, es eso y no el contenedor.
#
# EL TLS NO SE CORTA AQUÍ. Lo corta el balanceador corporativo (172.31.2.100) con
# el certificado `*.conaf.cl` y reenvía a esta VM por el puerto 80; el 443 está
# cerrado. Por eso llega `X-Forwarded-Proto: https` y por eso aquí no hay ni un
# `listen 443` ni un `ssl_certificate`.

server {
    listen 80;
    server_name reserva-bienestar.conaf.cl;

    access_log /var/log/nginx/coipo_cabania.access.log;
    error_log  /var/log/nginx/coipo_cabania.error.log;

    location / {
        # El contenedor `app` publica en 127.0.0.1:APP_PORT. Si el puerto cambia,
        # cambia en TRES sitios: el `.env` del servidor, este vhost y el registro
        # de puertos. El valor de abajo lo puso `sembrar.py` con `--puerto`.
        proxy_pass http://127.0.0.1:PUERTO_DE_LA_APP;

        # 1.1 y no 1.0: con HTTP/1.0 nginx no pide contenido comprimido, y entre
        # los dos nginx viajaría sin gzip todo lo que la aplicación comprima.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Analítica de visitas (coipo_umami) ───────────────────────────────
        # Inserta el `<script>` de Umami en el HTML de esta aplicación con
        # `sub_filter`. La aplicación NO lleva el script en su código: ponerlo
        # además aquí contaría cada visita DOS veces, porque `sub_filter_once`
        # inyecta igual aunque el HTML ya lo traiga.
        #
        # VA EN ESTE BLOQUE Y NO EN `server`, y no es estilo: `proxy_set_header`
        # se hereda del bloque de arriba SÓLO si el de abajo no declara ninguno.
        # Con el include en `server` y los `proxy_set_header` aquí, esta location
        # perdería `Host`, `X-Real-IP` y `X-Forwarded-*` **sin ningún error**.
        #
        # Requiere en ESTA máquina, puestos a mano por quien tenga sudo:
        #   /etc/nginx/conf.d/analitica-sitios.conf       (de coipo_umami)
        #   /etc/nginx/snippets/analitica-inyeccion.conf  (de coipo_umami)
        # Sin el primero, el segundo da `[emerg] unknown "analitica_..." variable`
        # y cae TODO nginx. Siempre `nginx -t` antes de recargar.
        #
        # Y falta un paso que no está en ningún archivo: dar de alta
        # `reserva-bienestar.conaf.cl` en Umami para obtener su `website id`, y añadir su línea
        # al `map $host $analitica_sitio` de `analitica-sitios.conf` en
        # coipo_umami. Mientras ese id no exista, la etiqueta inyectada es vacía:
        # no se mide nada y nada falla. Ver `docs/OBSERVABILIDAD.md` de la
        # fábrica.
        include snippets/analitica-inyeccion.conf;
    }
}
