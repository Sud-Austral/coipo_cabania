# Publica la maqueta (solo frontend) en GitHub Pages.
#
# Esto es exclusivo de la FASE DE MAQUETA: al construirse el backend FastAPI
# (fase 2), el despliegue pasa al pipeline institucional
# (.github/workflows/deploy-prod.yml, que reutiliza Sud-Austral/infra-docker-base)
# y este archivo se elimina o se limita a una rama de demostración.
#
# Requisito manual, una sola vez: Settings → Pages → Source = "GitHub Actions".

name: Publicar maqueta en Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Pages sirve el sitio bajo https://<org>.github.io/<repo>/, así que el base
      # NO es "/". Se deriva del nombre del repo en vez de escribirlo fijo: si el
      # repo se renombrara, una cadena literal dejaría el sitio pidiendo assets
      # que dan 404 sin que el build fallara.
      #
      # En el servidor CONAF el base sí es "/", y lo fija el ARG BASE_PATH de
      # frontend/Dockerfile. Por eso vite.config.js no declara ningún base.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # GitHub Pages no reescribe rutas. Con BrowserRouter (src/main.jsx), entrar
      # directo o recargar en .../coipo_cabania/catalogo hace que Pages busque un
      # archivo "catalogo" que no existe y sirva su propio 404.
      #
      # Copiar el index CONSTRUIDO a 404.html resuelve el caso completo y hace
      # innecesario el hack de redirección por query string: ese 404.html
      # referencia sus assets con rutas ABSOLUTAS (/coipo_cabania/assets/…, que
      # escribe Vite con el --base de arriba), así que carga igual desde cualquier
      # profundidad de URL, React arranca y BrowserRouter enruta con el pathname
      # real. Lo único distinto es el código HTTP —404 en vez de 200—, invisible
      # para quien navega.
      #
      # Tiene que ser el index construido y no un archivo suelto en public/: los
      # nombres de los assets llevan hash de contenido y cambian en cada build.
      - run: cp dist/index.html dist/404.html

      # Requiere que Pages esté configurado con Source = "GitHub Actions"
      # (Settings → Pages). Con Source = "Deploy from a branch", GitHub sirve el
      # repositorio con Jekyll y este paso falla.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
