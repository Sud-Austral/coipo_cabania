# Vhost real de tv.conaf.cl en 172.31.2.41 (vm2). APP_PORT=8117.
#
# Vive en el servidor (/etc/nginx/sites-available/tv.conaf.cl.conf), NO lo
# despliega este repositorio. Se versiona aquí como referencia.
#
# Escucha en 80 sin TLS a propósito, igual que el resto de las apps CONAF: el
# certificado se termina aguas arriba (toda la red entra por un servidor con
# TLS que resuelve https://tv.conaf.cl y reenvía en claro a este). Por eso el
# geoportal y la app móvil sí usan https:// hacia afuera.
#
# Cuando cambie el dominio definitivo, este archivo es LO ÚNICO que hay que
# tocar del lado servidor: la web usa rutas relativas (/api, /tiles) y no
# necesita reconstruirse. La app móvil sí requiere un APK nuevo, porque el
# dominio va dentro (mobile/.../js/app.js -> set_domain).

server {
    listen 80;
    server_name tv.conaf.cl;

    access_log /var/log/nginx/tv-conaf.access.log;
    error_log  /var/log/nginx/tv-conaf.error.log;

    # Las fotos que sube la app de terreno. Con el default de 1m fallan con un
    # 413 que no deja rastro en los registros de la aplicación móvil.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8117;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una sincronización de terreno sube permisos, ítems, fotos y el track
        # GPS completo; y los export CSV recorren toda la tabla. Con los 60s
        # por defecto se cortan a la mitad.
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
